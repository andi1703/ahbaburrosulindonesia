  <!-- Stem going outward -->
  <line x1="22.0" y1="22.0" x2="13.5" y2="13.5" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Fork prongs at tip -->
  <line x1="13.5" y1="13.5" x2="9.5" y2="7.0"  stroke="black" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="13.5" y1="13.5" x2="7.0" y2="9.5"  stroke="black" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="13.5" y1="13.5" x2="10.5" y2="10.5" stroke="black" stroke-width="2.8" stroke-linecap="round"/>
